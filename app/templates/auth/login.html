{% extends "auth/_layout.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<h1>Welcome back</h1>
<p class="muted">Log in to continue to your dashboard.</p>
<form method="post" class="form" data-loading="Signing you in...">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
      <button type="button" class="icon-btn toggle-password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
  </div>
  <label class="checkbox"><input type="checkbox" name="remember" value="1"> Remember me</label>
  <button type="submit" class="btn btn-primary btn-block">Log in</button>
</form>
<p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
