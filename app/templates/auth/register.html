{% extends "auth/_layout.html" %}
{% block title %}Create account{% endblock %}
{% block auth_content %}
<h1>Create your account</h1>
<p class="muted">It's free and takes less than a minute.</p>
<form method="post" class="form" data-loading="Creating your account...">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" value="{{ form.full_name }}" required minlength="2" maxlength="120" autocomplete="name" placeholder="e.g. Priya Sharma">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email }}" required maxlength="120" autocomplete="email" placeholder="you@example.com">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Min. 8 characters">
        <button type="button" class="icon-btn toggle-password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat password">
    </div>
  </div>
  <p class="hint"><i class="fa-solid fa-shield-halved"></i> Use at least 8 characters with letters and numbers.</p>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>
<p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
